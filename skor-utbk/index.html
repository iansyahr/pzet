<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Skor UTBK 2026</title>
    
    <!-- CSS Bootstrap 5 untuk styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS DataTables -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container container-box">
        <h2 class="text-center mb-4">Data Statistik Skor UTBK 2026</h2>
        
        <div class="table-responsive">
            <table id="tabel-utbk" class="table table-striped table-bordered" style="width:100%">
                <thead class="table-dark">
                    <tr>
                        <th>PTN</th>
                        <th>Program Studi</th>
                        <th>Jenis</th>
                        <th>Jumlah Lulus</th>
                        <th>Skor Minimum</th>
                        <th>Skor Rata-Rata</th>
                        <th>Skor Maksimum</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data akan dimuat secara otomatis oleh DataTables via AJAX -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    
    <!-- JS DataTables & Bootstrap -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <script>
        $(document).ready(function() {
            $('#tabel-utbk').DataTable({
                // Mengambil data dari link JSON Anda
                ajax: {
                    url: 'https://pzet.my.id/skor-utbk/2026.json',
                    dataSrc: 'data' // Menunjuk ke array "data" di dalam JSON
                },
                // Memetakan key JSON ke kolom tabel
                columns: [
                    { data: 'nama_singkat' },
                    { data: 'nama_prodi_ptn' },
                    { data: 'jenis' },
                    { data: 'jumlah', className: 'text-center' },
                    { 
                        data: 'minimum_utbk',
                        // Membulatkan skor menjadi 2 angka di belakang koma
                        render: function (data) {
                            return parseFloat(data).toFixed(2);
                        }
                    },
                    { 
                        data: 'average_utbk',
                        render: function (data) {
                            return parseFloat(data).toFixed(2);
                        }
                    },
                    { 
                        data: 'maximum_utbk',
                        render: function (data) {
                            return parseFloat(data).toFixed(2);
                        }
                    }
                ],
                // Mengatur urutan default berdasarkan Nama PTN (Kolom ke-0)
                order: [[0, 'asc']],
                language: {
                    url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/id.json' // Mengubah bahasa UI ke Bahasa Indonesia
                }
            });
        });
    </script>
</body>
</html>
