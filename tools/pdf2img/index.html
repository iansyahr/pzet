<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konverter PDF ke PNG</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-soft: #eef2ff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e5e7eb;
            --bg: #f5f6fa;
            --success: #059669;
            --danger: #dc2626;
            --radius: 16px;
            --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 12px 32px -12px rgba(16, 24, 40, .10);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 16px 64px;
            -webkit-font-smoothing: antialiased;
        }

        svg { width: 18px; height: 18px; flex-shrink: 0; }

        /* ===== Kartu utama ===== */
        .app {
            max-width: 680px; margin: 0 auto;
            background: #fff; border: 1px solid var(--border);
            border-radius: 20px; box-shadow: var(--shadow); overflow: hidden;
        }

        .head { display: flex; align-items: center; gap: 14px; padding: 22px 28px; border-bottom: 1px solid var(--border); }
        .head-icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: var(--primary-soft); color: var(--primary);
            display: grid; place-items: center;
        }
        .head-icon svg { width: 22px; height: 22px; }
        .head h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -.01em; }
        .head p { font-size: .875rem; color: var(--muted); margin-top: 2px; }

        .section { padding: 24px 28px; }
        .section + .section { border-top: 1px solid var(--border); }
        .section-label {
            display: flex; justify-content: space-between; align-items: center;
            font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
            color: var(--muted); margin-bottom: 14px;
        }
        .pill {
            text-transform: none; letter-spacing: 0; font-size: .8rem;
            color: var(--primary); background: var(--primary-soft);
            padding: 3px 10px; border-radius: 999px;
        }

        /* ===== Dropzone ===== */
        .dropzone {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 36px 20px; border: 1.5px dashed #c7cbe0; border-radius: 14px;
            background: #fafbff; cursor: pointer; transition: border-color .2s, background .2s;
        }
        .dropzone:hover { border-color: var(--primary); background: var(--primary-soft); }
        .dropzone.drag-over { border-color: var(--success); background: #ecfdf5; }
        .dropzone input { display: none; }
        .drop-icon {
            width: 48px; height: 48px; border-radius: 50%;
            background: #fff; border: 1px solid var(--border); color: var(--primary);
            display: grid; place-items: center; margin-bottom: 14px;
        }
        .drop-icon svg { width: 22px; height: 22px; }
        .drop-title { font-weight: 600; font-size: .95rem; }
        .drop-title b { color: var(--primary); font-weight: 600; }
        .drop-sub { color: var(--muted); font-size: .825rem; margin-top: 4px; }

        .file-info {
            display: none; align-items: center; gap: 12px;
            margin-top: 14px; padding: 12px 14px;
            border: 1px solid var(--border); border-radius: 12px;
        }
        .file-info.show { display: flex; }
        .file-badge {
            width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0;
            background: #fef2f2; color: var(--danger);
            font-size: .68rem; font-weight: 700; display: grid; place-items: center;
        }
        .file-meta { min-width: 0; flex: 1; }
        .file-meta .name { font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-meta .size { color: var(--muted); font-size: .8rem; margin-top: 1px; }

        /* ===== Status ===== */
        .status { display: none; margin-top: 14px; }
        .status.show { display: block; }
        .status-row { display: flex; align-items: center; gap: 10px; font-size: .875rem; font-weight: 500; }
        .status-row .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
        .status.success .status-row { color: var(--success); }
        .status.error .status-row { color: var(--danger); }
        .spinner {
            width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
            border: 2px solid #e0e7ff; border-top-color: var(--primary);
            animation: spin .7s linear infinite;
        }
        .progress { height: 6px; background: #eef0f6; border-radius: 999px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; width: 0; background: var(--primary); border-radius: 999px; transition: width .3s; }

        /* ===== Kualitas (segmented control) ===== */
        .segmented {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
            background: #f1f3f9; padding: 4px; border-radius: 12px;
        }
        .seg {
            border: 0; background: transparent; font: inherit; cursor: pointer;
            padding: 9px 4px; border-radius: 9px; white-space: nowrap;
            display: flex; flex-direction: column; align-items: center; gap: 1px;
            transition: background .15s, box-shadow .15s;
        }
        .seg strong { font-size: .875rem; font-weight: 600; color: var(--text); }
        .seg span { font-size: .75rem; color: var(--muted); }
        .seg:hover { background: rgba(255, 255, 255, .6); }
        .seg.active { background: #fff; box-shadow: 0 1px 3px rgba(16, 24, 40, .12); }
        .seg.active span { color: var(--primary); font-weight: 600; }

        .slider-row { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
        .slider-row label { font-size: .85rem; color: var(--muted); }
        input[type="range"] {
            flex: 1; height: 4px; border-radius: 999px; outline: none;
            -webkit-appearance: none; appearance: none;
            background: linear-gradient(to right, var(--primary) var(--fill, 16%), #e5e7eb var(--fill, 16%));
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
            background: #fff; border: 2px solid var(--primary); cursor: pointer;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .15);
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%;
            background: #fff; border: 2px solid var(--primary); cursor: pointer;
        }
        .scale-value {
            min-width: 52px; text-align: center; font-size: .85rem; font-weight: 600;
            font-variant-numeric: tabular-nums; padding: 5px 8px;
            border: 1px solid var(--border); border-radius: 8px;
        }

        .fname {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            margin-top: 18px; padding: 12px 14px;
            background: #f8fafc; border-radius: 10px; font-size: .85rem;
        }
        .fname svg { color: var(--muted); width: 16px; height: 16px; }
        .fname .lbl { color: var(--muted); }
        .fname .val { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }

        /* ===== Hasil ===== */
        .results { max-width: 1100px; margin: 32px auto 0; display: none; }
        .results.show { display: block; }

        .toolbar {
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
            background: rgba(255, 255, 255, .9); backdrop-filter: blur(8px);
            border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
            padding: 12px 14px 12px 20px; margin-bottom: 20px;
            position: sticky; top: 12px; z-index: 10;
        }
        .toolbar-info strong { font-size: .95rem; }
        .toolbar-info small { display: block; color: var(--muted); font-size: .8rem; margin-top: 1px; }
        .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            height: 38px; padding: 0 14px; border-radius: 10px;
            font: inherit; font-size: .85rem; font-weight: 600;
            cursor: pointer; border: 1px solid transparent; white-space: nowrap;
            transition: background .15s, border-color .15s, transform .1s;
        }
        .btn svg { width: 16px; height: 16px; }
        .btn:active { transform: scale(.97); }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-outline { background: #fff; color: var(--text); border-color: var(--border); }
        .btn-outline:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }
        .btn-danger { background: #fff; color: var(--danger); border-color: #fecaca; }
        .btn-danger:hover:not(:disabled) { background: #fef2f2; }
        .btn-reconvert { display: none; }
        .btn-reconvert.show { display: inline-flex; }

        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
        .card {
            background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
            display: flex; flex-direction: column; animation: fadeUp .35s ease both;
            transition: box-shadow .2s, transform .2s;
        }
        .card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
        .thumb {
            position: relative; aspect-ratio: 3 / 4; background: #f1f3f9;
            display: grid; place-items: center; padding: 14px; cursor: zoom-in;
        }
        .thumb img {
            max-width: 100%; max-height: 100%; object-fit: contain; background: #fff;
            border-radius: 3px; box-shadow: 0 2px 10px rgba(16, 24, 40, .12);
        }
        .page-badge {
            position: absolute; top: 10px; left: 10px;
            background: #fff; color: var(--text); border: 1px solid var(--border);
            font-size: .72rem; font-weight: 600; padding: 3px 8px; border-radius: 6px;
        }
        .card-body { padding: 12px; border-top: 1px solid var(--border); }
        .card-meta {
            display: flex; justify-content: space-between;
            font-size: .75rem; color: var(--muted); margin-bottom: 10px; font-variant-numeric: tabular-nums;
        }
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .card-actions .btn { height: 34px; padding: 0 8px; font-size: .8rem; }
        .btn.copied { color: var(--success); border-color: #a7f3d0; background: #ecfdf5; }

        /* ===== Lightbox ===== */
        .lightbox {
            position: fixed; inset: 0; z-index: 100; display: none;
            background: rgba(15, 23, 42, .9);
            align-items: center; justify-content: center; padding: 64px 72px;
        }
        .lightbox.show { display: flex; animation: fadeIn .15s ease; }
        .lightbox img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 4px; }
        .lb-btn {
            position: absolute; width: 44px; height: 44px; border-radius: 50%;
            border: 0; background: rgba(255, 255, 255, .12); color: #fff;
            display: grid; place-items: center; cursor: pointer;
        }
        .lb-btn:hover { background: rgba(255, 255, 255, .22); }
        .lb-btn svg { width: 22px; height: 22px; }
        .lb-close { top: 16px; right: 16px; }
        .lb-prev { left: 14px; top: 50%; transform: translateY(-50%); }
        .lb-next { right: 14px; top: 50%; transform: translateY(-50%); }
        .lb-caption {
            position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: .85rem; font-weight: 500;
            background: rgba(0, 0, 0, .4); padding: 6px 14px; border-radius: 999px;
        }

        /* ===== Toast ===== */
        .toast-wrap {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .toast {
            display: flex; align-items: center; gap: 8px;
            background: #0f172a; color: #fff; font-size: .85rem; font-weight: 500;
            padding: 10px 16px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
            animation: toastIn .25s ease;
        }
        .toast svg { width: 16px; height: 16px; }
        .toast.success svg { color: #34d399; }
        .toast.error svg { color: #f87171; }
        .toast.hide { animation: toastOut .25s ease forwards; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
        @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }
        @keyframes toastOut { to { opacity: 0; transform: translateY(10px); } }

        @media (max-width: 560px) {
            body { padding: 16px 12px 48px; }
            .head, .section { padding-left: 18px; padding-right: 18px; }
            .fname .val { margin-left: 0; width: 100%; }
            #gallery { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .card-actions { grid-template-columns: 1fr; }
            .toolbar { position: static; }
            .toolbar-actions { width: 100%; }
            .toolbar-actions .btn { flex: 1; }
            .lightbox { padding: 64px 8px; }
        }
    </style>
</head>
<body>

    <!-- ===== Kartu utama ===== -->
    <main class="app">
        <div class="head">
            <div class="head-icon" data-icon="fileImage"></div>
            <div>
                <h1>Konverter PDF ke PNG</h1>
                <p>Ubah setiap halaman PDF menjadi gambar, langsung di browser.</p>
            </div>
        </div>

        <div class="section">
            <div class="section-label">File PDF</div>
            <label class="dropzone" id="dropzone" for="pdf-upload">
                <input type="file" id="pdf-upload" accept=".pdf,application/pdf">
                <div class="drop-icon" data-icon="upload"></div>
                <div class="drop-title">Seret file ke sini atau <b>pilih file</b></div>
                <div class="drop-sub">Diproses secara lokal — file tidak diunggah ke server</div>
            </label>

            <div class="file-info" id="file-info">
                <div class="file-badge">PDF</div>
                <div class="file-meta">
                    <div class="name" id="file-name">-</div>
                    <div class="size" id="file-size">-</div>
                </div>
            </div>

            <div class="status" id="status">
                <div class="status-row">
                    <span id="status-icon"></span>
                    <span id="status-text"></span>
                    <span class="count" id="status-count"></span>
                </div>
                <div class="progress" id="progress"><div class="progress-fill" id="progress-fill"></div></div>
            </div>
        </div>

        <div class="section">
            <div class="section-label">
                Kualitas gambar
                <span class="pill" id="scale-chip">2.0x</span>
            </div>
            <div class="segmented">
                <button class="seg" data-scale="1"><strong>Rendah</strong><span>1x</span></button>
                <button class="seg active" data-scale="2"><strong>Standar</strong><span>2x</span></button>
                <button class="seg" data-scale="3"><strong>Tinggi</strong><span>3x</span></button>
                <button class="seg" data-scale="5"><strong>Ultra</strong><span>5x</span></button>
            </div>
            <div class="slider-row">
                <label for="scale-slider">Kustom</label>
                <input type="range" id="scale-slider" min="0.5" max="10" step="0.5" value="2">
                <div class="scale-value" id="scale-value">2.0x</div>
            </div>
            <div class="fname">
                <span data-icon="tag"></span>
                <span class="lbl">Format nama file</span>
                <span class="val" id="filename-example">-</span>
            </div>
        </div>
    </main>

    <!-- ===== Hasil ===== -->
    <section class="results" id="results">
        <div class="toolbar">
            <div class="toolbar-info">
                <strong id="toolbar-count">0 halaman</strong>
                <small id="toolbar-sub">-</small>
            </div>
            <div class="toolbar-actions">
                <button class="btn btn-outline btn-reconvert" id="btn-reconvert"><span data-icon="refresh"></span>Konversi ulang</button>
                <button class="btn btn-primary" id="btn-download-all"><span data-icon="download"></span>Unduh semua (ZIP)</button>
                <button class="btn btn-danger" id="btn-clear"><span data-icon="trash"></span>Hapus</button>
            </div>
        </div>
        <div id="gallery"></div>
    </section>

    <!-- ===== Lightbox ===== -->
    <div class="lightbox" id="lightbox">
        <button class="lb-btn lb-close" id="lb-close" data-icon="x" aria-label="Tutup"></button>
        <button class="lb-btn lb-prev" id="lb-prev" data-icon="left" aria-label="Sebelumnya"></button>
        <img id="lb-img" alt="Pratinjau">
        <button class="lb-btn lb-next" id="lb-next" data-icon="right" aria-label="Berikutnya"></button>
        <div class="lb-caption" id="lb-caption"></div>
    </div>

    <div class="toast-wrap" id="toast-wrap"></div>

<script>
    // ================= Ikon SVG =================
    const svg = (inner) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
    const ICONS = {
        fileImage: svg('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><circle cx="10" cy="13" r="2"/><path d="m20 17-1.1-1.1a2 2 0 0 0-2.8 0L10 22"/>'),
        upload:    svg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>'),
        download:  svg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'),
        copy:      svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
        check:     svg('<polyline points="20 6 9 17 4 12"/>'),
        checkCircle: svg('<circle cx="12" cy="12" r="10"/><polyline points="16 9 10.5 15 8 12.5"/>'),
        alert:     svg('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'),
        info:      svg('<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>'),
        trash:     svg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>'),
        refresh:   svg('<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>'),
        tag:       svg('<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>'),
        x:         svg('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'),
        left:      svg('<polyline points="15 18 9 12 15 6"/>'),
        right:     svg('<polyline points="9 18 15 12 9 6"/>')
    };
    document.querySelectorAll('[data-icon]').forEach(el => {
        el.insertAdjacentHTML('afterbegin', ICONS[el.dataset.icon]);
        if (el.tagName === 'SPAN') el.style.display = 'inline-flex';
    });

    // ================= Elemen =================
    const $ = (id) => document.getElementById(id);
    const pdfUpload = $('pdf-upload');
    const dropzone = $('dropzone');
    const fileInfo = $('file-info');
    const segs = document.querySelectorAll('.seg');
    const slider = $('scale-slider');
    const statusEl = $('status');
    const progressFill = $('progress-fill');
    const results = $('results');
    const gallery = $('gallery');
    const btnReconvert = $('btn-reconvert');
    const btnDownloadAll = $('btn-download-all');
    const lightbox = $('lightbox');

    // ================= State =================
    const state = {
        file: null,
        pdfData: null,
        images: [],
        totalPages: 0,
        selectedScale: 2,
        scaleUsed: null,
        renderToken: 0,
        isRendering: false,
        lbIndex: 0
    };

    // ================= Nama File: Tanggal - Jam - Halaman =================
    const pad = (n, len = 2) => String(n).padStart(len, '0');

    function getDateTimeParts(date = new Date()) {
        const tanggal = `${pad(date.getDate())}-${pad(date.getMonth() + 1)}-${date.getFullYear()}`;
        const jam = `${pad(date.getHours())}.${pad(date.getMinutes())}.${pad(date.getSeconds())}`;
        return { tanggal, jam };
    }

    // Contoh: 30-10-2026 - 14.35.22 - 01.png
    function buildFileName(pageNum, date = new Date()) {
        const { tanggal, jam } = getDateTimeParts(date);
        const digits = Math.max(2, String(state.totalPages || 1).length);
        return `${tanggal} - ${jam} - ${pad(pageNum, digits)}.png`;
    }

    const updateFilenameExample = () => $('filename-example').textContent = buildFileName(1);
    updateFilenameExample();
    setInterval(updateFilenameExample, 1000);

    // ================= Skala =================
    function updateScaleUI() {
        const s = state.selectedScale.toFixed(1) + 'x';
        $('scale-value').textContent = s;
        $('scale-chip').textContent = s;
        const pct = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
        slider.style.setProperty('--fill', pct + '%');
        segs.forEach(b => b.classList.toggle('active', parseFloat(b.dataset.scale) === state.selectedScale));
        const changed = state.pdfData && state.scaleUsed !== null && state.scaleUsed !== state.selectedScale;
        btnReconvert.classList.toggle('show', !!changed && !state.isRendering);
    }

    segs.forEach(b => b.addEventListener('click', () => {
        state.selectedScale = parseFloat(b.dataset.scale);
        slider.value = state.selectedScale;
        updateScaleUI();
    }));
    slider.addEventListener('input', () => {
        state.selectedScale = parseFloat(slider.value);
        updateScaleUI();
    });
    updateScaleUI();

    // ================= Upload =================
    pdfUpload.addEventListener('change', (e) => handleFile(e.target.files[0]));
    ['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.add('drag-over');
    }));
    dropzone.addEventListener('dragleave', (e) => {
        if (!dropzone.contains(e.relatedTarget)) dropzone.classList.remove('drag-over');
    });
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('drag-over');
        handleFile(e.dataTransfer.files[0]);
    });

    function formatBytes(b) {
        if (b < 1024) return b + ' B';
        if (b < 1024 ** 2) return (b / 1024).toFixed(1) + ' KB';
        return (b / 1024 ** 2).toFixed(2) + ' MB';
    }

    function handleFile(file) {
        if (!file) return;
        if (!(file.type === 'application/pdf' || /\.pdf$/i.test(file.name))) {
            toast('File harus berformat PDF', 'error');
            pdfUpload.value = '';
            return;
        }
        state.file = file;
        $('file-name').textContent = file.name;
        $('file-size').textContent = formatBytes(file.size);
        fileInfo.classList.add('show');

        const reader = new FileReader();
        reader.onload = () => { state.pdfData = reader.result; renderPdf(); };
        reader.onerror = () => toast('Gagal membaca file', 'error');
        reader.readAsArrayBuffer(file);
    }

    // ================= Status =================
    function setStatus(text, type = 'loading', count = '') {
        statusEl.className = 'status show ' + type;
        $('status-icon').innerHTML = type === 'loading' ? '<div class="spinner"></div>'
            : type === 'success' ? ICONS.checkCircle : ICONS.alert;
        $('status-icon').style.display = 'inline-flex';
        $('status-text').textContent = text;
        $('status-count').textContent = count;
        $('progress').style.display = type === 'loading' ? 'block' : 'none';
    }

    // ================= Render PDF =================
    function clearResults() {
        state.images.forEach(img => URL.revokeObjectURL(img.url));
        state.images = [];
        gallery.innerHTML = '';
        results.classList.remove('show');
    }

    async function renderPdf() {
        const token = ++state.renderToken;
        const scale = state.selectedScale;
        clearResults();
        state.isRendering = true;
        state.scaleUsed = scale;
        updateScaleUI();
        progressFill.style.width = '0%';
        setStatus('Memuat PDF...');

        try {
            const pdf = await pdfjsLib.getDocument({ data: state.pdfData.slice(0) }).promise;
            if (token !== state.renderToken) return;
            state.totalPages = pdf.numPages;
            $('toolbar-count').textContent = `${pdf.numPages} halaman`;
            $('toolbar-sub').textContent = `Kualitas ${scale.toFixed(1)}x · ${state.file.name}`;

            for (let i = 1; i <= pdf.numPages; i++) {
                if (token !== state.renderToken) return;
                setStatus(`Memproses halaman ${i}...`, 'loading', `${i} / ${pdf.numPages}`);

                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale });
                const canvas = document.createElement('canvas');
                canvas.width = Math.floor(viewport.width);
                canvas.height = Math.floor(viewport.height);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                await page.render({ canvasContext: ctx, viewport }).promise;
                const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                if (!blob) throw new Error('TOO_BIG');
                if (token !== state.renderToken) return;

                const item = { pageNum: i, blob, url: URL.createObjectURL(blob), width: canvas.width, height: canvas.height };
                state.images.push(item);
                addCard(item, state.images.length - 1);

                page.cleanup();
                canvas.width = canvas.height = 0;
                progressFill.style.width = (i / pdf.numPages * 100) + '%';
            }

            pdf.destroy();
            setStatus(`Selesai — ${pdf.numPages} halaman berhasil dikonversi`, 'success');
        } catch (err) {
            console.error(err);
            if (token === state.renderToken) {
                setStatus(err.message === 'TOO_BIG'
                    ? 'Gambar terlalu besar. Coba turunkan kualitas.'
                    : 'Gagal memproses PDF. Pastikan file valid dan tidak berpassword.', 'error');
            }
        } finally {
            if (token === state.renderToken) {
                state.isRendering = false;
                updateScaleUI();
            }
        }
    }

    // ================= Kartu =================
    function addCard(item, index) {
        results.classList.add('show');
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="thumb">
                <img src="${item.url}" alt="Halaman ${item.pageNum}" loading="lazy">
                <span class="page-badge">Hal. ${item.pageNum}</span>
            </div>
            <div class="card-body">
                <div class="card-meta">
                    <span>${item.width} × ${item.height}</span>
                    <span>${formatBytes(item.blob.size)}</span>
                </div>
                <div class="card-actions">
                    <button class="btn btn-outline" data-act="copy">${ICONS.copy}Salin</button>
                    <button class="btn btn-primary" data-act="download">${ICONS.download}Unduh</button>
                </div>
            </div>`;
        card.querySelector('.thumb').addEventListener('click', () => openLightbox(index));
        card.querySelector('[data-act="copy"]').addEventListener('click', (e) => copyImage(item, e.currentTarget));
        card.querySelector('[data-act="download"]').addEventListener('click', () => downloadImage(item));
        gallery.appendChild(card);
    }

    async function copyImage(item, btn) {
        if (!navigator.clipboard?.write || typeof ClipboardItem === 'undefined') {
            toast('Browser tidak mendukung salin gambar', 'error');
            return;
        }
        try {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': item.blob })]);
            const original = btn.innerHTML;
            btn.innerHTML = ICONS.check + 'Tersalin';
            btn.classList.add('copied');
            setTimeout(() => { btn.innerHTML = original; btn.classList.remove('copied'); }, 1800);
        } catch (err) {
            console.error(err);
            toast('Gagal menyalin. Periksa izin clipboard.', 'error');
        }
    }

    function triggerDownload(href, filename) {
        const a = document.createElement('a');
        a.href = href;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    function downloadImage(item, date = new Date()) {
        triggerDownload(item.url, buildFileName(item.pageNum, date));
    }

    async function downloadAll() {
        if (!state.images.length) return;
        const now = new Date();
        const { tanggal, jam } = getDateTimeParts(now);

        if (typeof JSZip === 'undefined') {
            state.images.forEach((item, i) => setTimeout(() => downloadImage(item, now), i * 250));
            toast('Mengunduh gambar satu per satu...', 'info');
            return;
        }

        const original = btnDownloadAll.innerHTML;
        btnDownloadAll.disabled = true;
        btnDownloadAll.innerHTML = '<div class="spinner" style="border-color:rgba(255,255,255,.35);border-top-color:#fff"></div>Membuat ZIP...';
        try {
            const zip = new JSZip();
            state.images.forEach(item => zip.file(buildFileName(item.pageNum, now), item.blob));
            const content = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(content);
            triggerDownload(url, `${tanggal} - ${jam}.zip`);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
            toast(`${state.images.length} gambar diunduh dalam ZIP`, 'success');
        } catch (err) {
            console.error(err);
            toast('Gagal membuat ZIP', 'error');
        } finally {
            btnDownloadAll.disabled = false;
            btnDownloadAll.innerHTML = original;
        }
    }

    function clearAll() {
        state.renderToken++;
        state.isRendering = false;
        clearResults();
        Object.assign(state, { file: null, pdfData: null, scaleUsed: null, totalPages: 0 });
        pdfUpload.value = '';
        fileInfo.classList.remove('show');
        statusEl.className = 'status';
        updateScaleUI();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    btnDownloadAll.addEventListener('click', downloadAll);
    $('btn-clear').addEventListener('click', clearAll);
    btnReconvert.addEventListener('click', () => state.pdfData && renderPdf());

    // ================= Lightbox =================
    function openLightbox(i) {
        state.lbIndex = i;
        showLb();
        lightbox.classList.add('show');
        document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
        lightbox.classList.remove('show');
        document.body.style.overflow = '';
    }
    function showLb() {
        const item = state.images[state.lbIndex];
        if (!item) return;
        $('lb-img').src = item.url;
        $('lb-caption').textContent = `Halaman ${item.pageNum} dari ${state.totalPages}`;
    }
    function navLb(step) {
        const n = state.images.length;
        state.lbIndex = (state.lbIndex + step + n) % n;
        showLb();
    }
    $('lb-close').addEventListener('click', closeLightbox);
    $('lb-prev').addEventListener('click', (e) => { e.stopPropagation(); navLb(-1); });
    $('lb-next').addEventListener('click', (e) => { e.stopPropagation(); navLb(1); });
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('show')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') navLb(-1);
        if (e.key === 'ArrowRight') navLb(1);
    });

    // ================= Toast =================
    function toast(msg, type = 'info') {
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.innerHTML = (type === 'success' ? ICONS.checkCircle : type === 'error' ? ICONS.alert : ICONS.info);
        el.append(msg);
        $('toast-wrap').appendChild(el);
        setTimeout(() => {
            el.classList.add('hide');
            el.addEventListener('animationend', () => el.remove());
        }, 2600);
    }
</script>
</body>
