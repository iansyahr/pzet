<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konverter PDF ke PNG</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <!-- JSZip untuk "Unduh Semua" dalam 1 file ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --bg: #f1f5f9;
            --card: #ffffff;
            --radius: 16px;
            --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .06);
            --gradient: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(circle at 10% 0%, rgba(99, 102, 241, .12) 0, transparent 40%),
                radial-gradient(circle at 90% 10%, rgba(139, 92, 246, .12) 0, transparent 40%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            padding: 32px 16px 64px;
        }

        .wrapper { max-width: 1100px; margin: 0 auto; }

        /* ---------- Header ---------- */
        .header { text-align: center; margin-bottom: 32px; animation: fadeDown .5s ease; }
        .logo {
            width: 64px; height: 64px; margin: 0 auto 16px;
            border-radius: 18px; background: var(--gradient);
            display: grid; place-items: center;
            box-shadow: 0 10px 30px rgba(99, 102, 241, .35);
        }
        .logo svg { width: 32px; height: 32px; color: #fff; }
        .header h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 800; letter-spacing: -.02em; }
        .header h1 span { background: var(--gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--muted); margin-top: 8px; }

        /* ---------- Layout ---------- */
        .grid-top { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-bottom: 20px; }
        .panel {
            background: var(--card); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 24px; border: 1px solid rgba(226, 232, 240, .7);
            animation: fadeUp .5s ease both;
        }
        .panel-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .panel-title h2 { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .chip {
            font-size: .8rem; font-weight: 600; color: var(--primary-dark);
            background: rgba(99, 102, 241, .1); padding: 4px 12px; border-radius: 999px;
        }

        /* ---------- Dropzone ---------- */
        .dropzone {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; min-height: 100%; padding: 36px 20px;
            border: 2px dashed #c7d2fe; border-radius: 14px; cursor: pointer;
            background: linear-gradient(135deg, rgba(99, 102, 241, .04), rgba(139, 92, 246, .04));
            transition: .25s ease;
        }
        .dropzone:hover, .dropzone:focus-within { border-color: var(--primary); background: rgba(99, 102, 241, .07); }
        .dropzone.drag-over { border-color: var(--success); background: rgba(16, 185, 129, .08); transform: scale(1.01); }
        .dropzone input { display: none; }
        .drop-icon {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(99, 102, 241, .12); color: var(--primary);
            display: grid; place-items: center; margin-bottom: 14px; transition: .25s;
        }
        .dropzone:hover .drop-icon { transform: translateY(-4px); }
        .drop-icon svg { width: 28px; height: 28px; }
        .drop-title { font-weight: 700; font-size: 1.05rem; }
        .drop-title b { color: var(--primary); }
        .drop-sub { color: var(--muted); font-size: .88rem; margin-top: 4px; }

        .file-info {
            display: none; align-items: center; gap: 12px; margin-top: 16px;
            padding: 12px 14px; border-radius: 12px; background: #f8fafc; border: 1px solid var(--border);
        }
        .file-info.show { display: flex; }
        .file-badge {
            flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px;
            background: #fee2e2; color: #dc2626; font-weight: 800; font-size: .7rem;
            display: grid; place-items: center;
        }
        .file-meta { min-width: 0; }
        .file-meta .name { font-weight: 600; font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-meta .size { color: var(--muted); font-size: .8rem; }

        /* ---------- Quality ---------- */
        .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
        .preset {
            border: 2px solid var(--border); border-radius: 12px; background: #fff;
            padding: 10px 6px; cursor: pointer; text-align: center; transition: .2s;
            font-family: inherit; color: inherit;
        }
        .preset:hover { border-color: #a5b4fc; transform: translateY(-2px); }
        .preset.active { border-color: var(--primary); background: rgba(99, 102, 241, .08); }
        .preset .label { font-weight: 700; font-size: .85rem; }
        .preset .value { color: var(--muted); font-size: .75rem; margin-top: 2px; }
        .preset.active .value { color: var(--primary-dark); }

        .slider-row { display: flex; align-items: center; gap: 14px; }
        .slider-row span { color: var(--muted); font-size: .88rem; }
        input[type="range"] {
            flex: 1; height: 6px; border-radius: 999px; outline: none; -webkit-appearance: none; appearance: none;
            background: linear-gradient(to right, var(--primary) var(--fill, 16%), var(--border) var(--fill, 16%));
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
            background: #fff; border: 4px solid var(--primary); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.2);
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%;
            background: #fff; border: 4px solid var(--primary); cursor: pointer;
        }
        .scale-value {
            min-width: 64px; text-align: center; font-weight: 700; color: var(--primary-dark);
            background: rgba(99, 102, 241, .1); border-radius: 10px; padding: 6px 10px;
        }

        .filename-preview {
            margin-top: 18px; padding: 12px 14px; border-radius: 12px;
            background: #f8fafc; border: 1px dashed var(--border); font-size: .85rem;
        }
        .filename-preview .lbl { color: var(--muted); font-size: .78rem; margin-bottom: 4px; }
        .filename-preview code {
            font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
            color: var(--primary-dark); font-weight: 600; word-break: break-all;
        }

        /* ---------- Status ---------- */
        .status-panel { display: none; margin-bottom: 20px; }
        .status-panel.show { display: block; }
        .status-row { display: flex; align-items: center; gap: 14px; }
        .spinner {
            width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
            border: 3px solid #e0e7ff; border-top-color: var(--primary);
            animation: spin .8s linear infinite;
        }
        .status-icon { font-size: 1.3rem; flex-shrink: 0; }
        .status-text { flex: 1; font-weight: 600; font-size: .95rem; }
        .status-text.error { color: var(--danger); }
        .status-text.success { color: var(--success); }
        .status-count { color: var(--muted); font-size: .85rem; font-weight: 600; }
        .progress { height: 8px; border-radius: 999px; background: #eef2ff; overflow: hidden; margin-top: 14px; }
        .progress-fill { height: 100%; width: 0; background: var(--gradient); border-radius: 999px; transition: width .3s ease; }

        /* ---------- Toolbar ---------- */
        .toolbar {
            display: none; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
            margin-bottom: 20px; position: sticky; top: 12px; z-index: 10;
            background: rgba(255, 255, 255, .85); backdrop-filter: blur(10px);
            padding: 14px 18px; border-radius: var(--radius); box-shadow: var(--shadow);
        }
        .toolbar.show { display: flex; }
        .toolbar-info { font-weight: 700; }
        .toolbar-info small { display: block; color: var(--muted); font-weight: 500; font-size: .8rem; }
        .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            border: none; border-radius: 10px; padding: 10px 18px;
            font-family: inherit; font-weight: 600; font-size: .9rem; cursor: pointer;
            transition: .2s ease; white-space: nowrap;
        }
        .btn:active { transform: scale(.96); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-primary { background: var(--gradient); color: #fff; box-shadow: 0 4px 14px rgba(99, 102, 241, .35); }
        .btn-primary:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(99, 102, 241, .5); transform: translateY(-1px); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover:not(:disabled) { background: #059669; }
        .btn-ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }
        .btn-ghost:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }
        .btn-danger-ghost { background: #fff; color: var(--danger); border: 1px solid #fecaca; }
        .btn-danger-ghost:hover:not(:disabled) { background: #fef2f2; }
        .btn-reconvert { display: none; }
        .btn-reconvert.show { display: inline-flex; animation: pulse 1.6s infinite; }

        /* ---------- Gallery ---------- */
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
        .card {
            background: var(--card); border-radius: var(--radius); overflow: hidden;
            box-shadow: var(--shadow); border: 1px solid rgba(226, 232, 240, .7);
            display: flex; flex-direction: column; transition: .25s ease; animation: fadeUp .4s ease both;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(15, 23, 42, .12); }
        .thumb {
            position: relative; aspect-ratio: 3 / 4; background: #f1f5f9;
            display: grid; place-items: center; padding: 14px; cursor: zoom-in; overflow: hidden;
        }
        .thumb img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            border-radius: 4px; box-shadow: 0 4px 14px rgba(15, 23, 42, .15); background: #fff;
            transition: transform .3s ease;
        }
        .thumb:hover img { transform: scale(1.03); }
        .page-badge {
            position: absolute; top: 10px; left: 10px;
            background: rgba(15, 23, 42, .75); color: #fff; font-size: .75rem; font-weight: 700;
            padding: 4px 10px; border-radius: 999px;
        }
        .zoom-hint {
            position: absolute; inset: 0; display: grid; place-items: center;
            background: rgba(15, 23, 42, .35); color: #fff; font-weight: 600; font-size: .9rem;
            opacity: 0; transition: .2s;
        }
        .thumb:hover .zoom-hint { opacity: 1; }
        .card-body { padding: 12px 14px 14px; }
        .card-meta { color: var(--muted); font-size: .78rem; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .card-actions .btn { justify-content: center; padding: 9px 10px; font-size: .85rem; }

        /* ---------- Empty state ---------- */
        .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
        .empty .big { font-size: 3rem; margin-bottom: 8px; opacity: .6; }

        /* ---------- Lightbox ---------- */
        .lightbox {
            position: fixed; inset: 0; z-index: 100; display: none;
            background: rgba(15, 23, 42, .92); backdrop-filter: blur(4px);
            align-items: center; justify-content: center; padding: 60px 70px;
        }
        .lightbox.show { display: flex; animation: fadeIn .2s ease; }
        .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
        .lb-btn {
            position: absolute; width: 46px; height: 46px; border-radius: 50%; border: none;
            background: rgba(255, 255, 255, .12); color: #fff; font-size: 1.4rem; cursor: pointer; transition: .2s;
        }
        .lb-btn:hover { background: rgba(255, 255, 255, .25); }
        .lb-close { top: 16px; right: 16px; }
        .lb-prev { left: 14px; top: 50%; transform: translateY(-50%); }
        .lb-next { right: 14px; top: 50%; transform: translateY(-50%); }
        .lb-caption {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            color: #fff; background: rgba(0, 0, 0, .45); padding: 6px 16px; border-radius: 999px; font-size: .88rem; font-weight: 600;
        }

        /* ---------- Toast ---------- */
        .toast-wrap { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: #1e293b; color: #fff; padding: 12px 18px; border-radius: 12px;
            font-size: .9rem; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.25);
            border-left: 4px solid var(--primary); animation: toastIn .3s ease; max-width: 340px;
        }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.hide { animation: toastOut .3s ease forwards; }

        /* ---------- Animations ---------- */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        @keyframes fadeDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
        @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
        @keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(99,102,241,.45); } 50% { box-shadow: 0 0 0 8px rgba(99,102,241,0); } }

        /* ---------- Responsive ---------- */
        @media (max-width: 860px) {
            .grid-top { grid-template-columns: 1fr; }
        }
        @media (max-width: 520px) {
            .presets { grid-template-columns: repeat(2, 1fr); }
            #gallery { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .card-actions { grid-template-columns: 1fr; }
            .toolbar { position: static; }
            .toolbar-actions, .toolbar-actions .btn { width: 100%; justify-content: center; }
            .lightbox { padding: 60px 10px; }
        }
    </style>
</head>
<body>
<div class="wrapper">

    <!-- Header -->
    <header class="header">
        <div class="logo">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </div>
        <h1>Konverter <span>PDF ke PNG</span></h1>
        <p>Ubah setiap halaman PDF menjadi gambar berkualitas tinggi, langsung di browser Anda.</p>
    </header>

    <!-- Upload + Settings -->
    <section class="grid-top">
        <div class="panel">
            <div class="panel-title"><h2>📁 Unggah File</h2></div>
            <label class="dropzone" id="dropzone" for="pdf-upload">
                <input type="file" id="pdf-upload" accept=".pdf,application/pdf">
                <div class="drop-icon">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                </div>
                <div class="drop-title">Seret & lepas PDF di sini, atau <b>klik untuk memilih</b></div>
                <div class="drop-sub">File diproses secara lokal, tidak diunggah ke server</div>
            </label>
            <div class="file-info" id="file-info">
                <div class="file-badge">PDF</div>
                <div class="file-meta">
                    <div class="name" id="file-name">-</div>
                    <div class="size" id="file-size">-</div>
                </div>
            </div>
        </div>

        <div class="panel" style="animation-delay:.08s">
            <div class="panel-title">
                <h2>🎚️ Kualitas Gambar</h2>
                <span class="chip" id="scale-chip">2.0x</span>
            </div>
            <div class="presets">
                <button class="preset" data-scale="1"><div class="label">Rendah</div><div class="value">1.0x · Cepat</div></button>
                <button class="preset active" data-scale="2"><div class="label">Standar</div><div class="value">2.0x · Seimbang</div></button>
                <button class="preset" data-scale="3"><div class="label">Tinggi</div><div class="value">3.0x · Jernih</div></button>
                <button class="preset" data-scale="5"><div class="label">Sangat Tinggi</div><div class="value">5.0x · HD</div></button>
            </div>
            <div class="slider-row">
                <span>Kustom</span>
                <input type="range" id="scale-slider" min="0.5" max="10" step="0.5" value="2">
                <div class="scale-value" id="scale-value">2.0x</div>
            </div>
            <div class="filename-preview">
                <div class="lbl">Contoh nama file (Tanggal - Jam - Halaman):</div>
                <code id="filename-example">-</code>
            </div>
        </div>
    </section>

    <!-- Status -->
    <section class="panel status-panel" id="status-panel">
        <div class="status-row">
            <div class="spinner" id="spinner"></div>
            <div class="status-icon" id="status-icon" style="display:none"></div>
            <div class="status-text" id="status-text">Memuat...</div>
            <div class="status-count" id="status-count"></div>
        </div>
        <div class="progress" id="progress"><div class="progress-fill" id="progress-fill"></div></div>
    </section>

    <!-- Toolbar -->
    <section class="toolbar" id="toolbar">
        <div class="toolbar-info">
            <span id="toolbar-count">0 halaman</span>
            <small id="toolbar-sub">Kualitas 2.0x</small>
        </div>
        <div class="toolbar-actions">
            <button class="btn btn-ghost btn-reconvert" id="btn-reconvert">🔄 Konversi Ulang</button>
            <button class="btn btn-primary" id="btn-download-all">📦 Unduh Semua (ZIP)</button>
            <button class="btn btn-danger-ghost" id="btn-clear">🗑️ Hapus</button>
        </div>
    </section>

    <!-- Gallery -->
    <section id="gallery"></section>
    <div class="empty" id="empty">
        <div class="big">🖼️</div>
        <div>Hasil konversi akan tampil di sini</div>
    </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
    <button class="lb-btn lb-close" id="lb-close" title="Tutup (Esc)">✕</button>
    <button class="lb-btn lb-prev" id="lb-prev" title="Sebelumnya (←)">‹</button>
    <img id="lb-img" alt="Pratinjau">
    <button class="lb-btn lb-next" id="lb-next" title="Berikutnya (→)">›</button>
    <div class="lb-caption" id="lb-caption"></div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
    // ================= Elemen =================
    const $ = (id) => document.getElementById(id);
    const pdfUpload = $('pdf-upload');
    const dropzone = $('dropzone');
    const fileInfo = $('file-info');
    const fileNameEl = $('file-name');
    const fileSizeEl = $('file-size');
    const presets = document.querySelectorAll('.preset');
    const slider = $('scale-slider');
    const scaleValueEl = $('scale-value');
    const scaleChip = $('scale-chip');
    const filenameExample = $('filename-example');
    const statusPanel = $('status-panel');
    const spinner = $('spinner');
    const statusIcon = $('status-icon');
    const statusText = $('status-text');
    const statusCount = $('status-count');
    const progress = $('progress');
    const progressFill = $('progress-fill');
    const toolbar = $('toolbar');
    const toolbarCount = $('toolbar-count');
    const toolbarSub = $('toolbar-sub');
    const btnReconvert = $('btn-reconvert');
    const btnDownloadAll = $('btn-download-all');
    const btnClear = $('btn-clear');
    const gallery = $('gallery');
    const emptyEl = $('empty');
    const lightbox = $('lightbox');
    const lbImg = $('lb-img');
    const lbCaption = $('lb-caption');

    // ================= State =================
    const state = {
        file: null,
        pdfData: null,      // ArrayBuffer asli (disimpan untuk konversi ulang)
        images: [],         // { pageNum, blob, url, width, height }
        totalPages: 0,
        selectedScale: 2,
        scaleUsed: null,
        renderToken: 0,
        isRendering: false,
        lbIndex: 0
    };

    // ================= Nama File =================
    const pad = (n, len = 2) => String(n).padStart(len, '0');

    function getDateTimeParts(date = new Date()) {
        const tanggal = `${pad(date.getDate())}-${pad(date.getMonth() + 1)}-${date.getFullYear()}`;
        // Pakai titik karena ":" tidak diizinkan di nama file Windows
        const jam = `${pad(date.getHours())}.${pad(date.getMinutes())}.${pad(date.getSeconds())}`;
        return { tanggal, jam };
    }

    /** Format: Tanggal - Jam - NomorHalaman.png  →  30-10-2026 - 14.35.22 - 01.png */
    function buildFileName(pageNum, date = new Date()) {
        const { tanggal, jam } = getDateTimeParts(date);
        const digits = Math.max(2, String(state.totalPages || 1).length);
        return `${tanggal} - ${jam} - ${pad(pageNum, digits)}.png`;
    }

    function updateFilenameExample() {
        filenameExample.textContent = buildFileName(1);
    }
    updateFilenameExample();
    setInterval(updateFilenameExample, 1000);

    // ================= Pengaturan Skala =================
    function updateScaleUI() {
        const s = state.selectedScale.toFixed(1) + 'x';
        scaleValueEl.textContent = s;
        scaleChip.textContent = s;
        const pct = ((slider.value - slider.min) / (slider.max - slider.min)) * 100;
        slider.style.setProperty('--fill', pct + '%');
        presets.forEach(p => p.classList.toggle('active', parseFloat(p.dataset.scale) === state.selectedScale));
        // Tampilkan tombol konversi ulang jika skala berubah setelah konversi
        const changed = state.pdfData && state.scaleUsed !== null && state.scaleUsed !== state.selectedScale;
        btnReconvert.classList.toggle('show', !!changed && !state.isRendering);
    }

    presets.forEach(p => p.addEventListener('click', () => {
        state.selectedScale = parseFloat(p.dataset.scale);
        slider.value = state.selectedScale;
        updateScaleUI();
    }));
    slider.addEventListener('input', () => {
        state.selectedScale = parseFloat(slider.value);
        updateScaleUI();
    });
    updateScaleUI();

    // ================= Upload & Drag-Drop =================
    pdfUpload.addEventListener('change', (e) => handleFile(e.target.files[0]));

    ['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.add('drag-over');
    }));
    dropzone.addEventListener('dragleave', (e) => {
        if (!dropzone.contains(e.relatedTarget)) dropzone.classList.remove('drag-over');
    });
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('drag-over');
        handleFile(e.dataTransfer.files[0]);
    });

    function formatBytes(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 ** 2) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1024 ** 2).toFixed(2) + ' MB';
    }

    function handleFile(file) {
        if (!file) return;
        const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
        if (!isPdf) {
            toast('File harus berformat PDF.', 'error');
            pdfUpload.value = '';
            return;
        }
        state.file = file;
        fileNameEl.textContent = file.name;
        fileSizeEl.textContent = formatBytes(file.size);
        fileInfo.classList.add('show');

        const reader = new FileReader();
        reader.onload = () => {
            state.pdfData = reader.result;
            renderPdf();
        };
        reader.onerror = () => toast('Gagal membaca file.', 'error');
        reader.readAsArrayBuffer(file);
    }

    // ================= Render PDF =================
    function setStatus(text, type = 'loading', count = '') {
        statusPanel.classList.add('show');
        statusText.textContent = text;
        statusText.className = 'status-text' + (type !== 'loading' ? ' ' + type : '');
        statusCount.textContent = count;
        spinner.style.display = type === 'loading' ? 'block' : 'none';
        statusIcon.style.display = type === 'loading' ? 'none' : 'block';
        statusIcon.textContent = type === 'success' ? '✅' : type === 'error' ? '❌' : '';
        progress.style.display = type === 'loading' ? 'block' : 'none';
    }

    function clearResults() {
        state.images.forEach(img => URL.revokeObjectURL(img.url));
        state.images = [];
        gallery.innerHTML = '';
        emptyEl.style.display = 'block';
        toolbar.classList.remove('show');
    }

    async function renderPdf() {
        const token = ++state.renderToken;   // untuk membatalkan proses lama
        const scale = state.selectedScale;
        clearResults();
        state.isRendering = true;
        state.scaleUsed = scale;
        updateScaleUI();
        progressFill.style.width = '0%';
        setStatus('Memuat PDF...');

        try {
            // .slice() karena PDF.js memindahkan (detach) buffer; dibutuhkan untuk konversi ulang
            const pdf = await pdfjsLib.getDocument({ data: state.pdfData.slice(0) }).promise;
            if (token !== state.renderToken) return;
            state.totalPages = pdf.numPages;

            for (let i = 1; i <= pdf.numPages; i++) {
                if (token !== state.renderToken) return;
                setStatus(`Memproses halaman ${i} dengan kualitas ${scale.toFixed(1)}x...`, 'loading', `${i}/${pdf.numPages}`);

                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale });
                const canvas = document.createElement('canvas');
                canvas.width = Math.floor(viewport.width);
                canvas.height = Math.floor(viewport.height);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';            // latar putih agar tidak transparan
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                await page.render({ canvasContext: ctx, viewport }).promise;
                const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                if (!blob) throw new Error('Ukuran gambar terlalu besar. Coba turunkan kualitas.');
                if (token !== state.renderToken) return;

                const item = { pageNum: i, blob, url: URL.createObjectURL(blob), width: canvas.width, height: canvas.height };
                state.images.push(item);
                addCard(item, state.images.length - 1);

                page.cleanup();
                canvas.width = canvas.height = 0;     // bebaskan memori
                progressFill.style.width = (i / pdf.numPages * 100) + '%';
            }

            pdf.destroy();
            setStatus(`Konversi selesai! ${pdf.numPages} halaman berhasil diubah menjadi PNG.`, 'success');
            toolbarCount.textContent = `${pdf.numPages} halaman`;
            toolbarSub.textContent = `Kualitas ${scale.toFixed(1)}x · ${state.file.name}`;
            toolbar.classList.add('show');
        } catch (err) {
            console.error(err);
            if (token === state.renderToken) {
                setStatus(err.message?.includes('terlalu besar') ? err.message : 'Gagal memproses PDF. Pastikan file valid dan tidak terkunci password.', 'error');
                if (state.images.length) toolbar.classList.add('show');
            }
        } finally {
            if (token === state.renderToken) {
                state.isRendering = false;
                updateScaleUI();
            }
        }
    }

    // ================= Kartu Gambar =================
    function addCard(item, index) {
        emptyEl.style.display = 'none';
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="thumb">
                <img src="${item.url}" alt="Halaman ${item.pageNum}" loading="lazy">
                <span class="page-badge">Hal. ${item.pageNum}</span>
                <div class="zoom-hint">🔍 Lihat</div>
            </div>
            <div class="card-body">
                <div class="card-meta">
                    <span>${item.width} × ${item.height}px</span>
                    <span>${formatBytes(item.blob.size)}</span>
                </div>
                <div class="card-actions">
                    <button class="btn btn-ghost" data-act="copy">📋 Salin</button>
                    <button class="btn btn-success" data-act="download">⬇️ Unduh</button>
                </div>
            </div>`;
        card.querySelector('.thumb').addEventListener('click', () => openLightbox(index));
        card.querySelector('[data-act="copy"]').addEventListener('click', (e) => copyImage(item, e.currentTarget));
        card.querySelector('[data-act="download"]').addEventListener('click', () => downloadImage(item));
        gallery.appendChild(card);
    }

    async function copyImage(item, btn) {
        if (!navigator.clipboard?.write || typeof ClipboardItem === 'undefined') {
            toast('Browser Anda tidak mendukung salin gambar ke clipboard.', 'error');
            return;
        }
        try {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': item.blob })]);
            const original = btn.innerHTML;
            btn.innerHTML = '✅ Tersalin';
            btn.disabled = true;
            setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 1800);
            toast(`Halaman ${item.pageNum} disalin ke clipboard.`, 'success');
        } catch (err) {
            console.error(err);
            toast('Gagal menyalin. Pastikan izin clipboard diberikan.', 'error');
        }
    }

    function triggerDownload(href, filename) {
        const a = document.createElement('a');
        a.href = href;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    function downloadImage(item, date = new Date()) {
        triggerDownload(item.url, buildFileName(item.pageNum, date));
    }

    async function downloadAll() {
        if (!state.images.length) return;
        const now = new Date();   // timestamp sama untuk semua halaman
        const { tanggal, jam } = getDateTimeParts(now);

        if (typeof JSZip === 'undefined') {
            // Fallback: unduh satu per satu
            state.images.forEach((item, i) => setTimeout(() => downloadImage(item, now), i * 250));
            toast('Mengunduh semua gambar satu per satu...', 'info');
            return;
        }

        btnDownloadAll.disabled = true;
        const original = btnDownloadAll.innerHTML;
        btnDownloadAll.innerHTML = '⏳ Membuat ZIP...';
        try {
            const zip = new JSZip();
            state.images.forEach(item => zip.file(buildFileName(item.pageNum, now), item.blob));
            const content = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(content);
            triggerDownload(url, `${tanggal} - ${jam}.zip`);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
            toast(`${state.images.length} gambar berhasil dikemas dalam ZIP.`, 'success');
        } catch (err) {
            console.error(err);
            toast('Gagal membuat ZIP.', 'error');
        } finally {
            btnDownloadAll.disabled = false;
            btnDownloadAll.innerHTML = original;
        }
    }

    function clearAll() {
        state.renderToken++;           // batalkan proses yang sedang berjalan
        state.isRendering = false;
        clearResults();
        state.file = null;
        state.pdfData = null;
        state.scaleUsed = null;
        state.totalPages = 0;
        pdfUpload.value = '';
        fileInfo.classList.remove('show');
        statusPanel.classList.remove('show');
        updateScaleUI();
        toast('Semua hasil telah dihapus.', 'info');
    }

    btnDownloadAll.addEventListener('click', downloadAll);
    btnClear.addEventListener('click', clearAll);
    btnReconvert.addEventListener('click', () => state.pdfData && renderPdf());

    // ================= Lightbox =================
    function openLightbox(index) {
        state.lbIndex = index;
        showLightboxImage();
        lightbox.classList.add('show');
        document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
        lightbox.classList.remove('show');
        document.body.style.overflow = '';
    }
    function showLightboxImage() {
        const item = state.images[state.lbIndex];
        if (!item) return;
        lbImg.src = item.url;
        lbCaption.textContent = `Halaman ${item.pageNum} dari ${state.totalPages}`;
    }
    function navLightbox(step) {
        const n = state.images.length;
        state.lbIndex = (state.lbIndex + step + n) % n;
        showLightboxImage();
    }
    $('lb-close').addEventListener('click', closeLightbox);
    $('lb-prev').addEventListener('click', (e) => { e.stopPropagation(); navLightbox(-1); });
    $('lb-next').addEventListener('click', (e) => { e.stopPropagation(); navLightbox(1); });
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('show')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') navLightbox(-1);
        if (e.key === 'ArrowRight') navLightbox(1);
    });

    // ================= Toast =================
    function toast(msg, type = 'info') {
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.textContent = msg;
        $('toast-wrap').appendChild(el);
        setTimeout(() => {
            el.classList.add('hide');
            el.addEventListener('animationend', () => el.remove());
        }, 2800);
    }
</script>
</body>
