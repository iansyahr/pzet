<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --border: #d1d5db;
    --error-bg: #fef2f2;
    --error: #b91c1c;
    --ok: #059669;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    background: var(--card);
    width: 100%;
    max-width: 480px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,.06);
    padding: 24px;
    align-self: flex-start;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; line-height: 1.5; }
  .drop {
    display: block;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .drop:hover, .drop.over { border-color: var(--primary); background: #eff6ff; }
  .drop .icon { font-size: 2rem; }
  .drop p { margin: 8px 0 0; color: var(--muted); font-size: .95rem; }
  .drop strong { color: var(--primary); }
  input[type=file] { display: none; }
  .file-info {
    margin-top: 14px;
    padding: 10px 12px;
    background: #f9fafb;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: .9rem;
    overflow-wrap: anywhere;
    display: none;
  }
  button, .btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 13px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }
  #splitBtn { background: var(--primary); color: #fff; }
  #splitBtn:hover:not(:disabled) { background: var(--primary-dark); }
  #splitBtn:disabled { background: #9ca3af; cursor: not-allowed; }
  .msg {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: .92rem;
    display: none;
    line-height: 1.4;
  }
  .msg.error { display: block; background: var(--error-bg); color: var(--error); border: 1px solid #fecaca; }
  .msg.ok { display: block; background: #ecfdf5; color: var(--ok); border: 1px solid #a7f3d0; }
  #results { display: none; margin-top: 4px; }
  .results-title { margin: 18px 0 0; font-size: .9rem; font-weight: 600; color: var(--muted); }
  .dl {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    padding: 12px 14px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    transition: border-color .2s, background .2s;
  }
  .dl:hover { border-color: var(--primary); background: #eff6ff; }
  .dl .dl-icon {
    flex: none;
    width: 40px; height: 40px;
    border-radius: 10px;
    background: #fee2e2;
    color: #b91c1c;
    font-size: .7rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .dl .dl-text { flex: 1; min-width: 0; }
  .dl .dl-name { display: block; font-weight: 600; font-size: .95rem; line-height: 1.3; overflow-wrap: anywhere; }
  .dl .dl-meta { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .dl .dl-action {
    flex: none;
    background: var(--primary);
    color: #fff;
    font-size: .85rem;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 8px;
  }
  footer { margin-top: 20px; font-size: .8rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main class="card">
  <h1>Split PDF</h1>
  <p class="sub">Pecah PDF menjadi dua file: halaman 1–2 (UNJ) dan halaman 3 (Balai Pustaka).</p>

  <label class="drop" id="drop" for="fileInput">
    <div class="icon">📄</div>
    <p><strong>Pilih file PDF</strong> atau seret dan lepas di sini</p>
  </label>
  <input type="file" id="fileInput" accept="application/pdf,.pdf">

  <div class="file-info" id="fileInfo"></div>

  <button id="splitBtn" disabled>Split PDF</button>

  <div class="msg" id="msg"></div>

  <div id="results">
    <p class="results-title">File hasil</p>
    <a class="dl" id="dl1"></a>
    <a class="dl" id="dl2"></a>
  </div>
</main>

<script>
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('fileInput');
  const fileInfo = document.getElementById('fileInfo');
  const splitBtn = document.getElementById('splitBtn');
  const msg = document.getElementById('msg');
  const results = document.getElementById('results');
  const dl1 = document.getElementById('dl1');
  const dl2 = document.getElementById('dl2');

  let currentFile = null;
  let objectUrls = [];

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }
  function clearMsg() { msg.className = 'msg'; msg.textContent = ''; }

  function resetResults() {
    objectUrls.forEach(u => URL.revokeObjectURL(u));
    objectUrls = [];
    results.style.display = 'none';
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  function isPdfName(file) {
    return /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
  }

  async function hasPdfHeader(file) {
    const buf = await file.slice(0, 1024).arrayBuffer();
    const text = new TextDecoder('latin1').decode(buf);
    return text.includes('%PDF-');
  }

  async function handleFile(file) {
    resetResults();
    clearMsg();
    currentFile = null;
    splitBtn.disabled = true;
    fileInfo.style.display = 'none';

    if (!file) return;

    if (!isPdfName(file) || !(await hasPdfHeader(file))) {
      showMsg('File "' + file.name + '" bukan PDF. Silakan pilih file berformat PDF.', 'error');
      fileInput.value = '';
      return;
    }

    currentFile = file;
    fileInfo.textContent = '📎 ' + file.name + ' (' + formatSize(file.size) + ')';
    fileInfo.style.display = 'block';
    splitBtn.disabled = false;
  }

  fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

  ['dragenter', 'dragover'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); })
  );
  ['dragleave', 'drop'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); })
  );
  drop.addEventListener('drop', e => {
    const files = e.dataTransfer.files;
    if (files.length > 1) {
      showMsg('Mohon unggah satu file PDF saja.', 'error');
      return;
    }
    handleFile(files[0]);
  });
  // Cegah browser membuka file jika dilepas di luar area
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  async function makePdf(srcDoc, indices) {
    const out = await PDFLib.PDFDocument.create();
    const pages = await out.copyPages(srcDoc, indices);
    pages.forEach(p => out.addPage(p));
    return out.save();
  }

  function setDownload(el, bytes, filename, label) {
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    objectUrls.push(url);
    el.href = url;
    el.download = filename;
    el.innerHTML =
      '<span class="dl-icon">PDF</span>' +
      '<span class="dl-text"><span class="dl-name"></span><span class="dl-meta"></span></span>' +
      '<span class="dl-action">Unduh</span>';
    el.querySelector('.dl-name').textContent = filename;
    el.querySelector('.dl-meta').textContent = label + ' • ' + formatSize(blob.size);
  }

  splitBtn.addEventListener('click', async () => {
    if (!currentFile) return;
    if (typeof PDFLib === 'undefined') {
      showMsg('Library pdf-lib gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.', 'error');
      return;
    }

    resetResults();
    clearMsg();
    splitBtn.disabled = true;
    splitBtn.textContent = 'Memproses...';

    try {
      const bytes = await currentFile.arrayBuffer();
      let src;
      try {
        src = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
      } catch (err) {
        throw new Error('PDF tidak dapat dibaca. File mungkin rusak atau dilindungi kata sandi.');
      }

      const total = src.getPageCount();
      if (total < 3) {
        throw new Error('PDF ini hanya memiliki ' + total + ' halaman. Dibutuhkan minimal 3 halaman untuk dipecah.');
      }

      const baseName = currentFile.name.replace(/\.pdf$/i, '');
      const pdf1 = await makePdf(src, [0, 1]);
      const pdf2 = await makePdf(src, [2]);

      setDownload(dl1, pdf1, baseName + ' - UNJ.pdf', 'Halaman 1–2');
      setDownload(dl2, pdf2, baseName + ' - Balai Pustaka.pdf', 'Halaman 3');
      results.style.display = 'block';

      let note = 'Berhasil! Silakan unduh kedua file di bawah.';
      if (total > 3) note += ' (Catatan: PDF asli memiliki ' + total + ' halaman; halaman 4 dan seterusnya tidak disertakan.)';
      showMsg(note, 'ok');
    } catch (err) {
      showMsg(err.message || 'Terjadi kesalahan saat memproses PDF.', 'error');
    } finally {
      splitBtn.disabled = false;
      splitBtn.textContent = 'Split PDF';
    }
  });
</script>
</body>
</html>
